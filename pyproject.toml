[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-engineering"
version = "0.1.0"
description = "Runtime-neutral engineering system for AI-assisted software development"
requires-python = ">=3.9"

[project.optional-dependencies]
codebrain = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]
web = [
  "crawl4ai==0.9.3",
]

[project.scripts]
e2e = "e2e.cli:main"

[tool.setuptools.packages.find]
include = ["e2e*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
