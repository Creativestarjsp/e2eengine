name: E2E Proof Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof-matrix:
    name: P0/P1/P2 • Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install E2E
        run: python -m pip install -e . pytest

      - name: P0 • unit and integration tests
        run: python -m pytest -q

      - name: P0 • runtime compilation
        run: python -m compileall -q e2e

      - name: P1/P2 • deterministic proof suite
        run: python -m e2e eval-suite run evals/proof.json

      - name: P1 • CodeBrain freshness
        run: |
          python -m e2e brain build
          python -m e2e brain check

      - name: P1 • guardrails
        run: python -m e2e guardrails check --stage verification

      - name: P2 • release contract
        run: python -m e2e release

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-proof-python-${{ matrix.python-version }}
          path: |
            .e2e/evals/proof.json
            .e2e/brain.json
            .e2e/guardrails.json
            .e2e/verification.json
          if-no-files-found: ignore

  proof-summary:
    name: Proof gate summary
    needs: proof-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every proof lane to pass
        run: |
          if [ "${{ needs.proof-matrix.result }}" != "success" ]; then
            echo "E2E proof gate failed. The project is NOT PROVEN."
            exit 1
          fi
          echo "P0/P1/P2 proof gate passed. Real-agent P3-P6 evidence is still required for PROVEN status."
